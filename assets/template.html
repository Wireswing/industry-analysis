<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产业智能分析报告</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1c2230;--border:#21262d;--border2:#30363d;
  --accent:#58a6ff;--accent2:#3fb950;--warn:#d29922;--danger:#f85149;
  --purple:#bc8cff;--orange:#f0883e;
  --text:#c9d1d9;--muted:#8b949e;--dim:#484f58;
  --mono:'JetBrains Mono','Fira Code','Consolas',monospace;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.6;padding:12px;min-height:100vh;}

.header{background:linear-gradient(135deg,#0d1b2a 0%,#1a2744 40%,#0d2137 100%);border:1px solid #1d3a5e;border-radius:12px;padding:16px 24px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.header-title{font-size:20px;font-weight:700;color:#fff;letter-spacing:.02em;}
.header-sub{font-size:11px;color:#7aa2c8;margin-top:3px;}
.badges{display:flex;gap:8px;flex-wrap:wrap;}
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.b-region{background:rgba(88,166,255,.15);color:#58a6ff;border:1px solid rgba(88,166,255,.3);}
.b-ind{background:rgba(188,140,255,.15);color:#bc8cff;border:1px solid rgba(188,140,255,.3);}
.b-data{background:rgba(63,185,80,.15);color:#3fb950;border:1px solid rgba(63,185,80,.3);}
.b-demo{background:rgba(248,81,73,.15);color:#f85149;border:1px solid rgba(248,81,73,.35);}

.warnbar{background:rgba(210,153,34,.08);border:1px solid rgba(210,153,34,.35);border-left:3px solid var(--warn);border-radius:8px;padding:8px 14px;margin-bottom:10px;font-size:12px;color:var(--warn);display:none;}

.main{display:flex;flex-direction:column;gap:12px;}
.panel-title{font-size:12px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px;}

.map-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;}
.map-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.map-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted);}
.map-controls label{display:flex;align-items:center;gap:4px;cursor:pointer;}
.map-container{width:100%;height:62vh;min-height:420px;border-radius:8px;overflow:hidden;border:1px solid var(--border2);background:#0a0e14;}
#map{width:100%;height:100%;}
.map-legend{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.leaflet-container{background:#0a0e14;font-family:var(--sans);}
.leaflet-tooltip{background:#1a2744;border:1px solid var(--accent);color:var(--text);font-size:11px;}
.leaflet-tooltip-top:before{border-top-color:var(--accent);}
.cluster-label{background:transparent!important;border:none!important;box-shadow:none!important;}

.tabs{background:var(--surface);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;}
.tab-nav{display:flex;gap:4px;padding:10px 14px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.tab-btn{padding:7px 12px;background:transparent;border:none;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;border-radius:6px 6px 0 0;white-space:nowrap;}
.tab-btn:hover{color:var(--text);background:rgba(255,255,255,.04);}
.tab-btn.active{color:var(--accent);background:rgba(88,166,255,.1);border-bottom:2px solid var(--accent);}
.tab-content{display:none;padding:14px;}
.tab-content.active{display:block;}

table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;}
th{background:rgba(88,166,255,.1);color:var(--accent);font-weight:600;text-align:left;padding:8px 10px;white-space:nowrap;}
td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.025);}
.tag{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px;}
.kpi{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;}
.kpi .v{font-size:20px;font-weight:700;color:var(--accent);word-break:break-all;}
.kpi .v.green{color:var(--accent2);} .kpi .v.orange{color:var(--warn);} .kpi .v.red{color:var(--danger);}
.kpi .l{font-size:10px;color:var(--muted);margin-top:2px;}

.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.chart-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;}
.chart-box.full{grid-column:1/-1;}
.chart-title{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:5px;}
.chart-wrap{position:relative;height:260px;}
canvas{max-width:100%;}

.ai-block{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:14px;margin-top:6px;}
.ai-block h4{font-size:12px;color:var(--purple);margin-bottom:8px;}
.ai-block p{font-size:12px;color:var(--text);line-height:1.8;margin-bottom:8px;}
.ai-block ol,.ai-block ul{padding-left:20px;font-size:12px;color:var(--text);line-height:1.9;}
.ai-block li{margin-bottom:4px;}
.tip{position:relative;cursor:help;}
.tip::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#1a2744;color:var(--text);border:1px solid var(--accent);padding:8px 12px;border-radius:8px;font-size:11px;white-space:pre-wrap;max-width:280px;width:max-content;z-index:9999;pointer-events:none;opacity:0;transition:opacity .2s;line-height:1.5;}
.tip:hover::after{opacity:1;}
.method-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px;}
.method-card h4{color:var(--accent);font-size:13px;margin-bottom:6px;}
.method-card p{color:var(--muted);font-size:12px;line-height:1.7;margin-bottom:6px;}
.method-card .plain{color:var(--text);font-size:12px;line-height:1.8;background:rgba(88,166,255,.06);padding:8px 12px;border-radius:6px;margin:6px 0 0;}
.method-card .formula{font-family:var(--mono);font-size:11px;color:var(--warn);background:rgba(210,153,34,.08);padding:8px 12px;border-radius:6px;border-left:3px solid var(--warn);margin:6px 0;white-space:pre-wrap;}
.fix-note{font-size:11px;color:var(--purple);margin-top:4px;}
.note{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.7;}
.rowlink{cursor:pointer;}
.rowlink td:first-child{color:var(--accent);text-decoration:underline dotted;}
.rowlink.hl td{background:rgba(88,166,255,.12)!important;}
.gap-box{font-size:12px;line-height:1.9;}
.gap-box .miss{color:var(--danger);} .gap-box .str{color:var(--accent2);}

::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
@media(max-width:1100px){.chart-grid{grid-template-columns:1fr;}}
@media print{
  body{background:#fff;padding:0;}
  .tab-content{display:block!important;}
  .map-container{height:420px;min-height:420px;}
  .chart-wrap{height:230px;}
  .warnbar{display:none!important;}
}
</style>
</head>

          <option value="cartodark">Carto·深色</option>

      </div>
    </div>
    <div class="map-container"><div id="map"></div></div>
    <div class="map-legend" id="mapLegend"></div>

</div>

// ---- 坐标系转换（wgs84/bd09 → gcj02） ----
function wgs2gcj(lng,lat){
  const a=6378245.0, ee=0.00669342162296594323;
  function tLat(x,y){let r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
    r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
    r+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;
    r+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;return r;}
  function tLng(x,y){let r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
    r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
    r+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;
    r+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;return r;}
  let dLat=tLat(lng-105,lat-35), dLng=tLng(lng-105,lat-35);
  const radLat=lat/180*Math.PI; let magic=1-ee*Math.sin(radLat)*Math.sin(radLat);
  const sqrtMagic=Math.sqrt(magic);
  dLat=(dLat*180)/((a*(1-ee))/(magic*sqrtMagic)*Math.PI);
  dLng=(dLng*180)/(a/sqrtMagic*Math.cos(radLat)*Math.PI);
  return [lng+dLng, lat+dLat];
}
function bd2gcj(lng,lat){
  const xPI=Math.PI*3000/180;
  const x=lng-0.0065, y=lat-0.006;
  const z=Math.sqrt(x*x+y*y)-0.00002*Math.sin(y*xPI);
  const th=Math.atan2(y,x)-0.000003*Math.cos(x*xPI);
  return [z*Math.cos(th), z*Math.sin(th)];
}
function toGCJ(lat,lng){
  if(CONFIG.coordSys==='wgs84'){const p=wgs2gcj(lng,lat);return [p[1],p[0]];}
  if(CONFIG.coordSys==='bd09'){const p=bd2gcj(lng,lat);return [p[1],p[0]];}
  return [lat,lng];
}

const FALLBACK = ['amap-dark','cartodark','osm'];
function setBasemap(key){
  if(st.tiles){st.map.removeLayer(st.tiles);st.tiles=null;}
  const b=BASEMAPS[key]||BASEMAPS['amap-dark'];
  st.tileErr=0;
  st.tiles=L.tileLayer(b.url,{subdomains:b.sub,attribution:b.attr,maxZoom:b.max,
    detectRetina:!!b.retina});
  st.tiles.on('tileerror',()=>{ st.tileErr++;
    if(st.tileErr>10 && FALLBACK.length>1){
      const cur=FALLBACK.indexOf(key);
      const next=FALLBACK[(cur+1+FALLBACK.length)%FALLBACK.length];
      if(next!==key){ $('selBasemap').value=next; setBasemap(next); }
    }});
  st.tiles.addTo(st.map);
}

function loadBoundary(){
  const code=CONFIG.adcode;
  if(!code){boundaryNote='未配置区域 adcode（边界未加载）';return;}
  fetch('https://geo.datav.aliyun.com/areas_v3/bound/'+code+'_full.json')
    .then(r=>{if(!r.ok)throw 0;return r.json();})
    .then(geo=>{
      if(!st.map.getPane('bnd')){st.map.createPane('bnd');st.map.getPane('bnd').style.zIndex=350;}
      st.boundary=L.geoJSON(geo,{pane:'bnd',style:{color:'#58a6ff',weight:1.2,fillOpacity:.05,fillColor:'#58a6ff'},
        onEachFeature:(f,lyr)=>{
          const nm=f.properties&&f.properties.name;
          if(nm)lyr.bindTooltip(nm,{sticky:true,direction:'top'});
        }});
      if($('chkBoundary').checked) st.boundary.addTo(st.map);
      st.boundaryOk=true;
      fitView();
    })
    .catch(()=>{boundaryNote='行政边界服务不可达（离线/网络受限），地图仍可正常展示企业分布。';});
}

function entColor(e,mode){
  if(mode==='cluster') return e.clusterColor||'#475569';
  if(mode==='industry') return (REPORT_DATA.industryLib&&REPORT_DATA.industryLib.color)||'#818cf8';
  if(mode==='scale'){const s=(e.scale||'');
    if(s.includes('大'))return '#f85149'; if(s.includes('中'))return '#f59e0b';
    if(s.includes('小'))return '#3fb950'; return '#58a6ff';}
  if(mode==='capital'){const c=e.capital||0;
    if(c>5000)return '#f85149'; if(c>1000)return '#f59e0b';
    if(c>100)return '#3fb950'; return '#475569';}
  return '#58a6ff';
}

function locateCluster(id){
  const cl=(A.clusters||[]).find(c=>c.id===id); if(!cl)return;
  const old=document.querySelector('#clusterTable tr.members');
  const same=old&&old.dataset.for===id; if(old)old.remove();
  if(!same){
    const ms=(REPORT_DATA.enterprises||[]).filter(e=>e.cluster===id);
    const tr=document.querySelector('#clusterTable tr[data-cid="'+id+'"]');
    if(tr){const d=document.createElement('tr');d.className='members';d.dataset.for=id;
      d.innerHTML='<td colspan="9"><div style="max-height:260px;overflow:auto;"><table><thead><tr><th>企业名称</th><th>子产业</th><th>注册资本(万)</th><th>成立年限</th><th>规模</th></tr></thead><tbody>'+
        ms.map(e=>'<tr><td>'+(e.name||'-')+'</td><td>'+(e.sub||'-')+'</td><td>'+(e.capital>0?fmt(e.capital):'-')+'</td><td>'+(e.age>0?e.age:'-')+'</td><td>'+(e.scale||'-')+'</td></tr>').join('')+
        '</tbody></table></div></td>';
      tr.after(d);}
    const pts=ms.filter(e=>e.lat!=null).map(e=>toGCJ(e.lat,e.lng));
    if(pts.length)st.map.flyToBounds(L.latLngBounds(pts).pad(.3),{duration:.6,maxZoom:15});
  }
  highlightClusterRow(id);
}

// ---- 渲染：韧性 ----
function renderResTab(){

  el.innerHTML=
  '<div class="chart-grid">'+
    '<div class="chart-box"><div class="chart-title">集中度对比（双口径 + 均匀参照）'+
    '<span class="tip" data-tip="HHI=Σ(份额²)；同时输出企业数口径与资本口径&#10;均匀参照=1/类别数（k类完全均匀时的HHI）&#10;CR4=前4家注册资本占比">ⓘ</span></div>'+
    '<div class="chart-wrap"><canvas id="cvHHI"></canvas></div></div>'+
    '<div class="chart-box"><div class="chart-title">规模结构</div>'+
    '<div class="chart-wrap"><canvas id="cvScale"></canvas></div></div>'+
  '</div>'+
  '<table><thead><tr><th>指标</th><th>数值</th><th>解读</th></tr></thead><tbody>'+

  '<tr><td>HHI（资本口径）</td><td><b style="color:'+(R.hhiCapital>R.uniformRef*3?'#f85149':R.hhiCapital>R.uniformRef*1.5?'#f59e0b':'#3fb950')+'">'+R.hhiCapital.toFixed(3)+'</b></td>'+

  '<tr><td>CR4（前4家资本占比）</td><td><b>'+(R.cr4*100).toFixed(1)+'%</b></td><td style="color:var(--muted);font-size:11px;">龙头集中度</td></tr>'+
  '<tr><td>类别数 k</td><td>'+R.catCount+'</td><td style="color:var(--muted);font-size:11px;">均匀参照 HHI=1/k='+R.uniformRef.toFixed(3)+'</td></tr>'+
  '<tr><td>主导类别</td><td>'+R.dom+'（'+R.domShare+'%）</td><td style="color:var(--muted);font-size:11px;">占比最高的产业/环节</td></tr>'+
  '</tbody></table>'+
  '<div class="note">'+(R.conclusion||'')+(R.scaleMissing>0?' 规模字段缺失率 '+(R.scaleMissing*100).toFixed(0)+'%。':'')+'</div>';
}

// ---- 渲染：方法与数据 ----
function renderMethods(){
  const el=$('tMethods'); const ds=META.dataSource||{};
  const levelName={province:'省级（边界显示地市）',city:'市级（边界显示区县）',district:'区县级（边界显示街道/乡镇）'}[(META.region||{}).level]||'';
  el.innerHTML=
  '<div class="method-card"><h4>① 空间聚类（DBSCAN）</h4>'+
  '<p>自动发现企业高密度聚集区域，识别噪声点（孤立企业）。聚类后按企业数降序统一编号 C1…Cn，集群以"质心所在区县·主导产业"自动命名，地图仅在每个集群质心放置一个编号徽章。</p>'+
  '<div class="formula">DBSCAN(eps='+CONFIG.dbscan.eps+'m, minPts='+CONFIG.dbscan.minPts+')\n坐标先做等距圆柱投影（x=lng·111320·cosφ₀, y=lat·110574），距离以米计算</div>'+
  '<p class="plain">基于企业间的空间距离识别聚集区：若某企业半径 eps 米范围内至少有 minPts 家企业，则与其邻近企业共同构成一个集群；不满足条件的企业视为分散分布。集群规模越大，表明该区域企业空间集聚程度越高，通常对应园区载体、产业配套或人才资源等共同区位因素。</p>'+
  '</div>'+
  '<div class="method-card"><h4>② 集群象限（实力 × 潜力）</h4>'+
  '<div class="formula">实力 = 0.40×规模分 + 0.35×资本强度 + 0.25×大中型占比\n潜力 = 0.50×新设占比 + 0.30×新设资本强度 + 0.20×密度(log(1+n)/log(1+n_max))\n切割：'+((A.quadrantCut||{}).mode||'中位数')+'（'+((A.quadrantCut||{}).nClusters||0)+'个集群）</div>'+
  '<p class="plain">从“实力”与“潜力”两个维度评价各集群。实力反映现有基础，由企业规模、注册资本强度和大中型企业占比构成；潜力反映增长动能，由近年新设企业占比、新设企业资本强度和集群密度构成。据此划分四类：双高为★明星（宜重点承接新增项目），实力高、潜力低为◆成熟（宜稳固存量），实力低、潜力高为▲潜力（宜重点培育），双低为▽弱势（宜评估整合或转型）。</p>'+
  '</div>'+
  '<div class="method-card"><h4>③ 产业活力指数</h4>'+
  '<div class="formula">活力 = '+CONFIG.weights[0]+'%×新设率 + '+CONFIG.weights[1]+'%×资本强度(log归一) + '+CONFIG.weights[2]+'%×集群密度\n存活率 = 在业/(在业+注销+吊销)，作为附加负向信号</div>'+
  '<p class="plain">以 0–100 分综合衡量区域产业的发展活跃度：新设企业比例越高、资本投入强度越大、企业集聚越密集，得分越高。存活率为仍在经营企业占全部登记企业的比例，用于辅助判断产业经营环境的稳定性。</p>'+
  '</div>'+
  '<div class="method-card"><h4>④ 区位商 LQ</h4>'+
  '<div class="formula">LQ = (本地产业占比) / (基准区产业占比)\n>1.25 显著优势 | 0.75~1.25 均衡 | <0.75 相对薄弱；类别 n&lt;30 标注小样本</div>'+
  '<p class="plain">区位商（LQ）比较某细分产业在本地的占比与其在参照区域（如全省或全国）的占比，用于判断本地产业专业化程度。例如 LQ=2 表示该产业在本地的比重是参照区域的 2 倍，具有相对优势；LQ 低于 0.75 表示相对薄弱。缺少参照区域数据时不计算 LQ，仅展示本地结构占比。</p>'+
  (A.lq&&A.lq.mode==='builtin'?'<div class="fix-note">注：本报告使用内置近似基准，建议替换为省级精确基准。</div>':'')+'</div>'+
  '<div class="method-card"><h4>⑤ 选址网格适宜性</h4>'+
  '<div class="formula">得分 = 0.30×交通 + 0.30×人才 + 0.25×集聚 + 0.15×商业（网格 '+CONFIG.gridSizeM+'m）</div>'+
  '<p class="plain">将研究区域划分为规则网格，从交通可达性、人才资源（高校及科研机构）、同业集聚和商业配套四个方面对每个网格评分。得分越高表示综合区位条件越适合新项目落地，可用于招商选址初筛；最终决策仍需结合用地指标、规划管控和政策条件综合判断。</p>'+
  '</div>'+
  '<div class="method-card"><h4>⑥ 产业链诊断</h4>'+
  '<div class="formula">环节得分 = 0.45×数量分(log) + 0.35×资本分 + 0.20×龙头分\n匹配：GBT 代码映射优先，关键词命中率按环节词库规模归一化</div>'+
  '<p class="plain">按上游、中游、下游将产业拆分为若干环节（如原材料、零部件、整机制造、运营服务），从企业数量、资本规模和龙头企业三方面评价本地各环节的发育程度。得分偏低的环节即产业链短板或缺失环节，可作为补链、强链招商的重点方向。</p>'+
  '</div>'+
  '<div class="method-card"><h4>⑦ 产业韧性（HHI 双口径 + CR4）</h4>'+
  '<div class="formula">HHI = Σ(份额²)，同时输出企业数口径与资本口径\n均匀参照 = 1/k（k个类别完全均匀时的HHI）；CR4 = 前4家资本占比</div>'+
  '<p class="plain">衡量产业结构的集中程度及抗风险能力。HHI（赫芬达尔指数）越接近均匀参照值，结构越多元、抗冲击能力越强；明显高于参照值则表明对少数细分领域或企业依赖度较高。CR4 为注册资本排名前 4 位企业的合计占比，数值越高资本集中度越高。</p>'+
  '</div>'+
  '<div class="method-card"><h4>⑧ 空间自相关（Moran\'s I，辅助）</h4>'+
  '<div class="formula">'+(A.moransI?('I = '+A.moransI.value.toFixed(3)+'，置换检验 p = '+A.moransI.p+'（'+A.moransI.note+'）'):'I = Σwᵢⱼ(xᵢ-x̄)(xⱼ-x̄) / Σ(xᵢ-x̄)²，k近邻行标准化，置换检验')+'</div>'+
  '<p class="plain">检验企业资本规模在空间上是否存在集聚特征，即资本规模较大的企业是否倾向于彼此邻近分布。I 大于 0 且 p 值小于 0.05 表示存在统计显著的正向空间集聚；I 接近 0 表示空间分布近似随机。该指标为辅助指标，用于佐证集群识别结果。</p>'+
  '</div>'+
  '<div class="method-card"><h4>📋 数据来源与口径</h4>'+
  '<table><tbody>'+
  '<tr><td>分析区域</td><td>'+((META.region||{}).province||'')+' '+((META.region||{}).city||'')+' '+((META.region||{}).district||'')+'（adcode '+((META.region||{}).adcode||'-')+'，'+levelName+'）</td></tr>'+
  '<tr><td>目标产业</td><td>'+((META.industry||{}).name||'-')+'（'+((META.industry||{}).type||'')+'）</td></tr>'+
  '<tr><td>数据来源</td><td>'+(ds.note||'-')+'</td></tr>'+
  '<tr><td>数据规模</td><td>检索 '+fmt(ds.total)+' → 去重后 '+fmt(ds.afterDedup)+' 家；坐标覆盖率 '+((ds.coordCoverage!=null)?(ds.coordCoverage*100).toFixed(0)+'%':'-')+'；在业 '+fmt((ds.statusDist||{})['在业'])+' 家</td></tr>'+
  ((ds.keywords||[]).length?'<tr><td>拉取关键词</td><td style="font-size:11px;">'+ds.keywords.join('、')+'</td></tr>':'')+
  (ds.fetchedAt?'<tr><td>拉取时间</td><td>'+ds.fetchedAt+'</td></tr>':'')+
  '<tr><td>企业坐标系</td><td>'+CONFIG.coordSys.toUpperCase()+'（叠加高德底图前自动转换）</td></tr>'+
  '<tr><td>报告生成</td><td>'+(META.generatedAt||'-')+' · industry-analysis skill</td></tr>'+
  '</tbody></table>'+
  '<div class="note">🔒 安全说明：本报告为静态交付物，不包含任何 API 凭证或密钥；数据拉取所用凭证仅在生成过程中的会话内存内使用，不随报告保存。<br>'+
  '⚠ 局限声明：1）工商注册口径反映"注册分布"而非实际经营分布；2）关键词/GBT启发式分类存在误差；3）LQ 与基准口径（企业数 vs 产值/就业）不同，仅反映相对结构；4）小样本（类别&lt;30家、集群&lt;4个）结论稳健性有限，已就地标注。'+
  (boundaryNote?'<br>⚠ '+boundaryNote:'')+'</div></div>';
}

// ---- 图表调度 ----
function renderChartsFor(key){
  if(key==='tCluster')drawQuadrant();
  else if(key==='tVitality')drawVitality();
  else if(key==='tLQ')drawLQ();
  else if(key==='tGrid')drawGrid();
  else if(key==='tChain')drawChain();
  else if(key==='tRes')drawRes();
}

// ---- 头部与启动 ----
function renderHeader(){
  $('hTitle').textContent=META.title||'产业智能分析报告';
  const r=META.region||{}, ind=META.industry||{};
  $('hSub').textContent='生成于 '+(META.generatedAt||'-')+' · 数据来源：'+((META.dataSource||{}).note||'-')+
    ' · 企业坐标系 '+CONFIG.coordSys.toUpperCase();
  const b=[];
  b.push('<span class="badge b-region">📍 '+[r.province,r.city,r.district].filter(Boolean).join(' · ')+'</span>');
  if(ind.name)b.push('<span class="badge b-ind">🏭 '+ind.name+'</span>');
  if(META.demo)b.push('<span class="badge b-demo">演示数据（虚构企业）</span>');
  $('hBadges').innerHTML=b.join('');
  if(META.warnings&&META.warnings.length){
    const wb=$('warnBar');
    wb.style.display='block';
    wb.innerHTML='⚠ '+META.warnings.join('　⚠ ');
  }
}

document.addEventListener('DOMContentLoaded',()=>{
  renderHeader();
  buildTabs();
  renderOverview();
  renderClusterTab();
  renderVitalityTab();
  renderLQTab();
  renderGridTab();
  renderChainTab();
  renderResTab();
  renderMethods();
  initMap();
  const active=document.querySelector('.tab-content.active');
  if(active)renderChartsFor(active.id);
});
</script>
